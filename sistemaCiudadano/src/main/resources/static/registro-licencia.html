<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitud de Licencia de Construcción</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: #f3f3fd; }
        .form-card { margin: 40px auto; background: #fff; border-radius: 14px; max-width: 700px; box-shadow: 0 4px 24px #5a579726; padding: 32px 40px;}
        label { color: #2b2d2f; font-weight: 600; font-size: 14px; margin-bottom: 4px; display: block;}
        input, textarea, select {
            width: 100%; border-radius: 6px; border: 2px solid #e0e0e0; padding: 10px 12px;
            font-size: 14px; margin-bottom: 20px; background: #f5f5f5; color: #424242;
        }
        .enviar-btn {
            margin-top: 18px; background: #536dfe; color: #fff; border: none; padding: 12px 32px; border-radius: 6px;
            font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .enviar-btn:disabled { background: #b4c2ef; color: #fff; cursor: not-allowed;}
        .enviar-btn:hover { background: #3949ab; }
        .volver-btn {
            margin-bottom: 18px; background: #6a82fb; color: #fff; border: none; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .volver-btn:hover { background: #44318d; }
        .exito-msg { color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;}
        small { color: #888; }
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='index.html'" class="volver-btn">← Volver al inicio</button>
    <h2 style="margin-bottom:18px;">Solicitud de Licencia de Construcción</h2>

    <label for="nombreSolicitante">Nombre*</label>
    <input type="text" id="nombreSolicitante" required placeholder="Ingrese el nombre completo">

    <label for="documentoIdentidad">Identificación*</label>
    <input type="text" id="documentoIdentidad" required placeholder="Ingrese solo números">

    <label for="direccionObra">Dirección de la obra*</label>
    <input type="text" id="direccionObra" required placeholder="Ejem: Cra #21-39 San Jose">

    <label for="tipoTramite">Tipo de trámite*</label>
    <select id="tipoTramite" required>
        <option value="">Seleccione...</option>
        <option value="obraNueva">Obra nueva</option>
        <option value="remodelacion">Remodelación</option>
        <option value="demolicion">Demolición</option>
    </select>
    <small>Seleccione el tipo de tramite</small>

    <label for="observaciones">Observaciones</label>
    <textarea id="observaciones" placeholder="Ingrese sus observaciones"></textarea>

    <button class="enviar-btn" id="btnEnviar" onclick="enviarFormulario()">Iniciar proceso</button>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    function enviarFormulario() {
        const body = {
            nombreSolicitante: document.getElementById('nombreSolicitante').value,
            documentoIdentidad: document.getElementById('documentoIdentidad').value,
            direccionObra: document.getElementById('direccionObra').value,
            tipoTramite: document.getElementById('tipoTramite').value,
            observaciones: document.getElementById('observaciones').value
        };

        // Aquí cambia la URL a tu endpoint real para iniciar el proceso
        fetch('/api/licencia-construccion/registrar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        }).then(r => {
            if (r.ok) {
                document.getElementById('mensajeExito').innerText = '¡Proceso iniciado exitosamente!';
                document.getElementById('mensajeExito').style.display = '';
            } else {
                alert('Error al enviar el formulario.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    }
</script>
</body>
</html>
