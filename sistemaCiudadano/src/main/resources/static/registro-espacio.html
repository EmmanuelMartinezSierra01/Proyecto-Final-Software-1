<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Proceso Espacio Público</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: #f3f3fd; }
        .form-card { margin: 40px auto; background: #fff; border-radius: 14px; max-width: 700px; box-shadow: 0 4px 24px #5a579726; padding: 32px 40px;}
        label { color: #2b2d2f; font-weight: 600; font-size: 14px; margin-bottom: 4px; display: block;}
        input, textarea, select {
            width: 100%; border-radius: 6px; border: 2px solid #e0e0e0; padding: 10px 12px;
            font-size: 14px; margin-bottom: 20px; background: #f5f5f5; color: #424242;
        }
        .checkbox-group { margin-bottom: 20px;}
        .checkbox-inline { display: flex; align-items: center; margin-bottom: 8px;}
        .checkbox-inline input { width: auto; margin-right: 9px;}
        .enviar-btn {
            margin-top: 18px; background: #536dfe; color: #fff; border: none; padding: 12px 32px; border-radius: 6px;
            font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .enviar-btn:disabled { background: #b4c2ef; color: #fff; cursor: not-allowed;}
        .enviar-btn:hover { background: #3949ab; }
        .volver-btn {
            margin-bottom: 18px; background: #6a82fb; color: #fff; border: none; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .volver-btn:hover { background: #44318d; }
        .exito-msg { color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;}
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='index.html'" class="volver-btn">← Volver al inicio</button>
    <h2 style="margin-bottom:18px;">Iniciar proceso Espacio Público</h2>

    <div class="checkbox-group">
        <div class="checkbox-inline">
            <input type="checkbox" id="Solicitud"> <label for="Solicitud">Solicitud escrita</label>
        </div>
        <div class="checkbox-inline">
            <input type="checkbox" id="Documentos"> <label for="Documentos">Otra documentación</label>
        </div>
        <div class="checkbox-inline">
            <input type="checkbox" id="EspacioLibre"> <label for="EspacioLibre">Espacio libre</label>
        </div>
        <div class="checkbox-inline">
            <input type="checkbox" id="UsoCorrecto"> <label for="UsoCorrecto">Uso correcto</label>
        </div>
    </div>

    <label for="Nombre">Nombre</label>
    <input type="text" id="Nombre">

    <label for="Direccion">Dirección</label>
    <input type="text" id="Direccion">

    <label for="Tipo_Uso">Tipo de uso</label>
    <select id="Tipo_Uso">
        <option value="">Seleccione...</option>
        <option value="Publicidad">Publicidad</option>
        <option value="Reunion">Reunión</option>
        <option value="Feria">Feria</option>
    </select>

    <label for="Cobro">Cobro base</label>
    <input type="number" id="Cobro">

    <button class="enviar-btn" id="btnEnviar" onclick="enviarFormulario()">Iniciar proceso</button>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    function enviarFormulario() {
        // Captura los valores y los envía como objeto plano
        const body = {
            Solicitud:    document.getElementById('Solicitud').checked,
            Documentos:   document.getElementById('Documentos').checked,
            EspacioLibre: document.getElementById('EspacioLibre').checked,
            UsoCorrecto:  document.getElementById('UsoCorrecto').checked,
            Nombre:       document.getElementById('Nombre').value,
            Direccion:    document.getElementById('Direccion').value,
            Tipo_Uso:     document.getElementById('Tipo_Uso').value,
            Cobro:        parseInt(document.getElementById('Cobro').value)
        };

        fetch('/api/espacio-publico/registrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(r => {
            if (r.ok) {
                document.getElementById('mensajeExito').innerText = '¡Proceso iniciado exitosamente!';
                document.getElementById('mensajeExito').style.display = '';
            } else {
                alert('Error al enviar el formulario.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    }

</script>
</body>
</html>
