<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ciudadano Alcaldía</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:600,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #6a82fb 0%, #fc5c7d 100%);
            min-height: 100vh; margin:0; padding:0;
        }
        .menu-open-btn {
            position: absolute;
            top: 24px; left: 24px;
            background: #44318d;
            border: none;
            color: #fff;
            font-size: 28px;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 12;
            transition: background 0.17s;
        }
        .menu-open-btn:hover {
            background: #fc5c7d;
        }
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 240px;
            height: 100vh;
            background: #44318d;
            color: #fff; box-shadow: 4px 0 20px rgba(68,49,141,0.12);
            padding: 36px 22px 0 22px;
            transform: translateX(-260px);
            transition: transform 0.28s cubic-bezier(.78,.22,.26,.98);
            z-index: 20;
            display: flex; flex-direction: column;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar h2 {
            font-size: 22px; margin-bottom: 36px; font-weight: 600;
        }
        .consultar-box {
            margin-bottom: 40px; width:100%;
        }
        .consultar-box label {
            font-size: 15px; font-weight: 500; margin-bottom: 8px; display:block;
        }
        .consultar-box input {
            width: 100%;
            padding: 9px 12px;
            border: none; border-radius: 6px;
            margin-bottom: 10px; font-size: 15px; color: #3e2c77;
        }
        .consultar-box button {
            background:#fc5c7d; color:#fff; border:none; border-radius:6px; font-size:15px;
            padding:9px 14px; cursor:pointer; font-weight:600;
            transition: background 0.19s;
        }
        .consultar-box button:hover { background: #f53b57;}
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            position: absolute; top: 20px; right: 18px;
            cursor:pointer;
        }
        main {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; padding: 0 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(76,51,158,0.20);
            max-width: 540px; width: 100%;
            padding: 48px 40px;
            text-align: center;
            margin-top: 42px;
        }
        h1 { color: #282c34; font-size: 28px; margin-bottom: 14px; }
        .subtitle { color: #726fa9; margin-bottom: 20px; font-size: 17px; }
        .button-group { display: flex; gap: 22px; margin-top: 36px; justify-content: center;}
        .pqrs-btn {
            background: linear-gradient(100deg, #6a82fb 0%, #fc5c7d 100%);
            color: #fff; border: none; border-radius: 8px;
            padding: 18px 26px; font-size: 17px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 10px rgba(74,101,206,0.10);
        }
        .pqrs-btn:active { transform: scale(0.96);}
        .pqrs-btn:hover { box-shadow: 0 4px 18px rgba(250,92,125,0.15);}
        .icon { font-size: 21px; margin-right:7px;}
        @media (max-width: 900px) {
            .card { max-width:98vw; padding: 26px 7px;}
            .button-group { gap: 10px;}
            .sidebar { width:90vw;}
        }
        /* Fondo oscuro para foco en menú */
        .sidebar-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(44,22,70,0.24);
            display:none; z-index:11;
        }
        .sidebar-bg.active { display:block;}
    </style>
</head>
<body>
<button class="menu-open-btn" id="openMenuBtn">☰</button>
<div class="sidebar" id="sidebarMenu">
    <button class="close-btn" id="closeMenuBtn" title="Cerrar menú">&times;</button>
    <h2>Menú</h2>
    <form class="consultar-box" onsubmit="buscarProcesosPorCedula(event)">
        <label for="searchCedula">Consultar procesos por cédula</label>
        <input type="text" id="searchCedula" placeholder="Ingrese su cédula">
        <button type="submit">Buscar</button>
    </form>
</div>
<div class="sidebar-bg" id="sidebarBg"></div>
<main>
    <div class="card">
        <h1>Bienvenido al Portal Ciudadano</h1>
        <div class="subtitle">
            Elija el tipo de solicitud que desea registrar:
        </div>
        <div class="button-group">
            <button class="pqrs-btn" id="btnPeticion">
                <span class="icon">💬</span> Petición PQRS
            </button>
            <button class="pqrs-btn" id="btnEspacio">
                <span class="icon">🏟</span> Solicitud Espacio Público
            </button>
            <button class="pqrs-btn" id="btnLicencia">
                <span class="icon">🏗</span> Licencia de Construcción
            </button>
        </div>
        <div id="infoMensaje" style="margin-top:16px; color:#fc5c7d; display:none;"></div>
    </div>
</main>
<script>
    // Sidebar menu control
    const openBtn = document.getElementById('openMenuBtn');
    const closeBtn = document.getElementById('closeMenuBtn');
    const sidebar = document.getElementById('sidebarMenu');
    const sidebarBg = document.getElementById('sidebarBg');
    openBtn.onclick = function() {
        sidebar.classList.add('open');
        sidebarBg.classList.add('active');
    }
    closeBtn.onclick = hideMenu;
    sidebarBg.onclick = hideMenu;
    function hideMenu() {
        sidebar.classList.remove('open');
        sidebarBg.classList.remove('active');
    }

    // Buscar por cédula
    function buscarProcesosPorCedula(e) {
        e.preventDefault();
        let cedula = document.getElementById('searchCedula').value.trim();
        if (cedula.length < 6) {
            alert('Ingrese una cédula válida.');
        } else {
            window.location.href = 'procesos.html?cedula=' + encodeURIComponent(cedula);
            hideMenu();
        }
    }

    // Botones principales
    document.getElementById('btnPeticion').onclick = function() {
        window.location.href = 'registro-pqrs.html';
    }
    document.getElementById('btnEspacio').onclick = function() {
        window.location.href = 'registro-espacio.html';
    }
    document.getElementById('btnLicencia').onclick = function() {
        window.location.href = 'registro-licencia.html'
    }
    function mostrarInfo(msg) {
        var info = document.getElementById('infoMensaje');
        info.textContent = msg;
        info.style.display = 'block';
        setTimeout(()=>{ info.style.display='none'; }, 2500);
    }
</script>
</body>
</html>
