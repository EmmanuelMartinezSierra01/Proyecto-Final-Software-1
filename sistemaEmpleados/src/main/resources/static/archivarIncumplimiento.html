<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Archivar por Incumplimiento</title>
    <style>
        body { font-family:'Montserrat', Arial, sans-serif; background:#f3f3fd;}
        .form-card { margin:40px auto; background:#fff; border-radius:14px; max-width:1080px; box-shadow:0 4px 24px #5a579726; padding:32px 40px;}
        label { color:#2b2d2f; font-weight:600; font-size:15px; margin-bottom:4px; display:block;}
        input, textarea {
            width:100%; border-radius:6px; border:2px solid #e0e0e0; padding:10px 12px;
            font-size:16px; margin-bottom:18px; background:#f5f5f5; color:#424242;
        }
        input[readonly], textarea[readonly] { color:#888; }
        .flex-row { display:flex; gap:30px; }
        .flex-g { flex:1; }
        .enviar-btn { background:#536dfe; color:#fff; border:none; padding:12px 36px; border-radius:6px;
            font-size:16px; cursor:pointer; font-weight:600; margin-top:15px;}
        .enviar-btn:disabled { background:#b4c2ef; }
        .exito-msg { color:#28bb6a; margin-top:16px; font-size:15px; font-weight:600;}
        small { color:#888; }
    </style>
</head>
<body>
<div class="form-card">
    <h2 style="margin-bottom:18px;">Archivar proceso por incumplimiento</h2>
    <form id="archForm">

        <div class="flex-row">
            <div class="flex-g">
                <label for="solicitudId">Solicitud ID</label>
                <input type="text" id="solicitudId" name="solicitudId" readonly>
            </div>
            <div class="flex-g">
                <label for="nombreSolicitante">Nombre del solicitante</label>
                <input type="text" id="nombreSolicitante" name="nombreSolicitante" readonly>
            </div>
            <div class="flex-g">
                <label for="informacionSolicitada">Información que fue solicitada</label>
                <textarea id="informacionSolicitada" name="informacionSolicitada" readonly></textarea>
            </div>
            <div class="flex-g">
                <label for="fechaLimiteDocumentos">Fecha límite (vencida)</label>
                <input type="text" id="fechaLimiteDocumentos" name="fechaLimiteDocumentos" readonly>
            </div>
        </div>

        <div class="flex-row">
            <div class="flex-g">
                <label for="archivoMotivo">Detalle del motivo de archivo*</label>
                <textarea id="archivoMotivo" name="archivoMotivo" required placeholder="Describa las razones específicas del archivo"></textarea>
                <small>Describa las razones específicas del archivo</small>
            </div>
            <div class="flex-g">
                <label for="fechaArchivo">Fecha de archivo*</label>
                <input type="text" id="fechaArchivo" name="fechaArchivo" required placeholder="YYYY-MM-DD">
                <small>Formato: YYYY-MM-DD</small>
            </div>
        </div>

        <button class="enviar-btn" type="submit" id="btnEnviar">Archivar proceso</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');
    if (taskId) {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r=>r.json())
            .then(data=>{
                document.getElementById('solicitudId').value = data.solicitudId?.value || '';
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('informacionSolicitada').value = data.informacionSolicitada?.value || '';
                document.getElementById('fechaLimiteDocumentos').value = data.fechaLimiteDocumentos?.value || '';
                document.getElementById('archivoMotivo').value = data.archivoMotivo?.value || '';
                document.getElementById('fechaArchivo').value = data.fechaArchivo?.value || '';
            });
    }
    document.getElementById('archForm').addEventListener('submit', function(e){
        e.preventDefault();
        if(!taskId) {
            alert('No se pudo determinar el taskId.');
            return;
        }
        const motivo = document.getElementById('archivoMotivo').value;
        const fecha = document.getElementById('fechaArchivo').value;
        if(!motivo.trim() || !fecha.trim()) {
            alert('Complete motivo y fecha de archivo.');
            return;
        }
        const vars = {
            archivoMotivo: { value: motivo, type:"String" },
            fechaArchivo: { value: fecha, type:"String" }
        };
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vars)
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Proceso archivado correctamente.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
            } else {
                alert('Error al archivar el proceso.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
