<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Técnica</title>
    <style>
        body { font-family:'Montserrat', Arial, sans-serif; background:#f3f3fd;}
        .form-card { margin:40px auto; background:#fff; border-radius:14px; max-width:1200px; box-shadow:0 4px 24px #5a579726; padding:32px 40px;}
        label { color:#2b2d2f; font-weight:600; font-size:15px; margin-bottom:4px; display:block;}
        input, textarea {
            width:100%; border-radius:6px; border:2px solid #e0e0e0; padding:10px 12px;
            font-size:16px; margin-bottom:18px; background:#f5f5f5; color:#424242;
        }
        input[readonly], textarea[readonly] { color:#888; }
        .flex-row { display:flex; gap:28px; }
        .flex-g { flex:1; }
        .col-radio { display: flex; flex-direction: column; gap:6px; }
        .radio-group { margin-bottom:13px; }
        .radio-label { margin-left:8px; font-weight:500; }
        .enviar-btn { background:#536dfe; color:#fff; border:none; padding:12px 36px; border-radius:6px;
            font-size:16px; cursor:pointer; font-weight:600; margin-top:15px;}
        .enviar-btn:disabled { background:#b4c2ef; }
        .exito-msg { color:#28bb6a; margin-top:16px; font-size:15px; font-weight:600;}
        small { color:#888; }
    </style>
</head>
<body>
<div class="form-card">
    <h2 style="margin-bottom:18px;">Evaluación técnica estructural y normativa</h2>
    <form id="evalForm">

        <div class="flex-row">
            <div class="flex-g">
                <label for="solicitudId">Solicitud ID</label>
                <input type="text" id="solicitudId" name="solicitudId" readonly>
            </div>
            <div class="flex-g">
                <label for="nombreSolicitante">Nombre del solicitante</label>
                <input type="text" id="nombreSolicitante" name="nombreSolicitante" readonly>
            </div>
            <div class="flex-g">
                <label for="direccionObra">Dirección de la obra</label>
                <input type="text" id="direccionObra" name="direccionObra" readonly>
            </div>
        </div>

        <div class="flex-row">
            <div class="flex-g col-radio">
                <label>Diseño estructural adecuado*</label>
                <div class="radio-group">
                    <input type="radio" id="estructuraSi" name="estructuraAdecuada" value="true">
                    <label for="estructuraSi" class="radio-label">Sí</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="estructuraNo" name="estructuraAdecuada" value="false">
                    <label for="estructuraNo" class="radio-label">No</label>
                </div>
                <small>¿Diseño estructural es adecuado?</small>
            </div>
            <div class="flex-g col-radio">
                <label>Planos cumplen normativa*</label>
                <div class="radio-group">
                    <input type="radio" id="cumpleNormasSi" name="cumpleNormasTecnicas" value="true">
                    <label for="cumpleNormasSi" class="radio-label">Sí</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="cumpleNormasNo" name="cumpleNormasTecnicas" value="false">
                    <label for="cumpleNormasNo" class="radio-label">No</label>
                </div>
                <small>¿Cumple normas técnicas?</small>
            </div>
            <div class="flex-g col-radio">
                <label>Evaluación técnica Final*</label>
                <div class="radio-group">
                    <input type="radio" id="aprobada" name="evaluacionTecnica" value="true">
                    <label for="aprobada" class="radio-label">APROBADA</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="rechazada" name="evaluacionTecnica" value="false">
                    <label for="rechazada" class="radio-label">RECHAZADA</label>
                </div>
                <small>¿En base a los resultados obtenidos considera que aprueba la evaluación?</small>
            </div>
        </div>

        <div class="flex-row">
            <div class="flex-g">
                <label for="observacionesTecnicas">Observaciones técnicas*</label>
                <textarea id="observacionesTecnicas" name="observacionesTecnicas" required placeholder="Detalle los hallazgos de la evaluación técnica"></textarea>
                <small>Detalle los hallazgos de la evaluación técnica</small>
            </div>
        </div>

        <button class="enviar-btn" type="submit" id="btnEnviar">Guardar evaluación</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');
    if (taskId) {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r=>r.json())
            .then(data=>{
                document.getElementById('solicitudId').value = data.solicitudId?.value || '';
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('direccionObra').value = data.direccionObra?.value || '';
                document.getElementById('observacionesTecnicas').value = data.observacionesTecnicas?.value || '';
                // Radios
                if(data.estructuraAdecuada?.value === true)  document.getElementById('estructuraSi').checked = true;
                if(data.estructuraAdecuada?.value === false) document.getElementById('estructuraNo').checked = true;
                if(data.cumpleNormasTecnicas?.value === true)  document.getElementById('cumpleNormasSi').checked = true;
                if(data.cumpleNormasTecnicas?.value === false) document.getElementById('cumpleNormasNo').checked = true;
                if(data.evaluacionTecnica?.value === true)  document.getElementById('aprobada').checked = true;
                if(data.evaluacionTecnica?.value === false) document.getElementById('rechazada').checked = true;
            });
    }
    document.getElementById('evalForm').addEventListener('submit', function(e){
        e.preventDefault();
        if(!taskId) {
            alert('No se pudo determinar el taskId.');
            return;
        }
        // Radios obligatorios
        const r1 = document.querySelector('input[name="estructuraAdecuada"]:checked');
        const r2 = document.querySelector('input[name="cumpleNormasTecnicas"]:checked');
        const r3 = document.querySelector('input[name="evaluacionTecnica"]:checked');
        if(!r1 || !r2 || !r3 || !document.getElementById('observacionesTecnicas').value.trim()){
            alert('Complete todos los campos obligatorios.');
            return;
        }
        const vars = {
            estructuraAdecuada: { value: r1.value === "true", type:"Boolean" },
            cumpleNormasTecnicas: { value: r2.value === "true", type:"Boolean" },
            evaluacionTecnica: { value: r3.value === "true", type: "Boolean" },
            observacionesTecnicas: { value: document.getElementById('observacionesTecnicas').value, type:"String" }
        };
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vars)
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Evaluación registrada correctamente.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
            } else {
                alert('Error al guardar la información.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
