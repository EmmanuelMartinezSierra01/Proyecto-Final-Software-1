<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Pago Total</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: #f3f3fd; }
        .form-card { margin: 40px auto; background: #fff; border-radius: 14px; max-width: 410px; box-shadow: 0 4px 24px #5a579726; padding: 32px 40px;}
        label { color: #2b2d2f; font-weight: 600; font-size: 16px; margin-bottom: 10px; display: block;}
        input { width: 100%; border-radius: 6px; border: 2px solid #e0e0e0; padding: 10px 12px; font-size: 16px; margin-bottom: 22px; background: #f5f5f5; color: #424242;}
        .enviar-btn { background: #536dfe; color: #fff; border: none; padding: 12px 32px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.16s;}
        .enviar-btn:disabled { background: #b4c2ef; color: #fff; cursor: not-allowed;}
        .enviar-btn:hover { background: #3949ab; }
        .volver-btn { margin-bottom: 20px; background: #6a82fb; color: #fff; border: none; padding: 9px 22px; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.16s;}
        .volver-btn:hover { background: #44318d; }
        .exito-msg { color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;}
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='menuEmpleado.html'" class="volver-btn">← Volver al inicio</button>
    <h2 style="margin-bottom:18px;">Pago de Solicitud</h2>
    <form id="pagoForm">
        <label for="RecibirPago">Ingrese el pago total</label>
        <input type="number" id="RecibirPago" required placeholder="Ingrese el monto...">
        <button class="enviar-btn" type="submit" id="btnEnviar">Guardar pago</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');

    document.getElementById('pagoForm').addEventListener('submit', function(e){
        e.preventDefault();
        if(!taskId) {
            alert('No se pudo determinar el taskId.');
            return;
        }
        const pago = document.getElementById('RecibirPago').value;
        if (!pago.trim()) {
            alert('Debe ingresar el pago total.');
            return;
        }
        const variables = {
            RecibirPago: { value: parseInt(pago), type: "Long" }
        };
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(variables)
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Pago registrado y tarea completada.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
                document.getElementById('RecibirPago').readOnly = true;
            } else {
                alert('Error al guardar el pago.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
