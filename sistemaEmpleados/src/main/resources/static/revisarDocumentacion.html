<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revisión de Documentación Subproceso</title>
    <style>
        body { font-family:'Montserrat', Arial, sans-serif; background:#f3f3fd;}
        .form-card { margin:40px auto; background:#fff; border-radius:14px; max-width:900px; box-shadow:0 4px 24px #5a579726; padding:32px 40px;}
        label { color:#2b2d2f; font-weight:600; font-size:15px; margin-bottom:4px; display:block;}
        input, textarea {
            width:100%; border-radius:6px; border:2px solid #e0e0e0; padding:10px 12px;
            font-size:16px; margin-bottom:18px; background:#f5f5f5; color:#424242;
        }
        input[type="checkbox"] { width:auto; margin-right:8px;}
        input[readonly], textarea[readonly] { background:#f5f5f5; color:#888; }
        .flex-row { display:flex; gap:24px;}
        .flex-col { display:flex; flex-direction:column; flex:0.5;}
        .mb16 { margin-bottom:16px; }
        .mb8 { margin-bottom:8px; }
        .center-v { display: flex; align-items:center;}
        .enviar-btn { background:#536dfe; color:#fff; border:none; padding:12px 36px; border-radius:6px;
            font-size:16px; cursor:pointer; font-weight:600; margin-top:16px;}
        .enviar-btn:disabled { background:#b4c2ef; }
        .exito-msg { color:#28bb6a; margin-top:16px; font-size:15px; font-weight:600;}
    </style>
</head>
<body>
<div class="form-card">
    <h2 style="margin-bottom:18px;">Revisión de documentación</h2>

    <form id="revForm">
        <label for="solicitudId">Solicitud ID</label>
        <input type="text" id="solicitudId" name="solicitudId" readonly>

        <div class="flex-row">
            <div class="flex-col">
                <label for="nombreSolicitante">Nombre del solicitante</label>
                <input type="text" id="nombreSolicitante" name="nombreSolicitante" readonly>
            </div>
            <div class="flex-col">
                <label for="direccionObra">Dirección de la obra</label>
                <input type="text" id="direccionObra" name="direccionObra" readonly>
            </div>
            <div class="flex-col center-v mb16">
                <input type="checkbox" id="tieneEscritura" name="tieneEscritura" disabled>
                <label for="tieneEscritura" style="font-weight:500;display:inline;">Escritura del predio presentada</label>
            </div>
        </div>

        <div class="mb8">
            <input type="checkbox" id="faltaDocumentacion" name="faltaDocumentacion" disabled>
            <label for="faltaDocumentacion" style="font-weight:500;display:inline;">Falta documentación</label>
        </div>

        <button class="enviar-btn" type="submit" id="btnEnviar">Completar revisión</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    // Toma taskId por URL: revisarDocumentacionSubproceso.html?taskId=...
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');

    if(taskId){
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r=>r.json())
            .then(data=>{
                document.getElementById('solicitudId').value = data.solicitudId?.value || '';
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('direccionObra').value = data.direccionObra?.value || '';
                document.getElementById('tieneEscritura').checked = data.tieneEscritura?.value === true;
                // El campo faltaDocumentacion lo muestras según variable, pero por tu instrucción:
                // Falta documentación siempre es false en este subproceso
                document.getElementById('faltaDocumentacion').checked = false;
            });
    }

    document.getElementById('revForm').addEventListener('submit', function(e){
        e.preventDefault();
        if(!taskId){
            alert('No se pudo determinar el taskId.');
            return;
        }
        // No se edita nada, solo se completa la tarea
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}' // No variables a actualizar
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Revisión completada.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
            } else {
                alert('Error al completar la revisión.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
