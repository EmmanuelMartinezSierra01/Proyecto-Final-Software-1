<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación Jurídica</title>
    <style>
        body { font-family:'Montserrat', Arial, sans-serif; background:#f3f3fd;}
        .form-card { margin:40px auto; background:#fff; border-radius:14px; max-width:1380px; box-shadow:0 4px 24px #5a579726; padding:32px 40px;}
        label { color:#2b2d2f; font-weight:600; font-size:15px; margin-bottom:4px; display:block;}
        input, textarea {
            width:100%; border-radius:6px; border:2px solid #e0e0e0; padding:10px 12px;
            font-size:16px; margin-bottom:18px; background:#f5f5f5; color:#424242;
        }
        input[readonly], textarea[readonly] { color:#888; }
        .col-radio { display: flex; flex-direction: column; gap:6px; }
        .radio-group { margin-bottom:13px; }
        .radio-label { margin-left:8px; font-weight:500; }
        .flex-row { display:flex; gap:24px; }
        .flex-g { flex:1; }
        .enviar-btn { background:#536dfe; color:#fff; border:none; padding:12px 36px; border-radius:6px;
            font-size:16px; cursor:pointer; font-weight:600; margin-top:15px;}
        .enviar-btn:disabled { background:#b4c2ef; }
        .exito-msg { color:#28bb6a; margin-top:16px; font-size:15px; font-weight:600;}
        small { color:#888; }
    </style>
</head>
<body>
<div class="form-card">
    <h2 style="margin-bottom:18px;">Evaluación jurídica</h2>
    <form id="jurForm">
        <div class="flex-row">
            <div class="flex-g">
                <label for="solicitudId">Solicitud ID</label>
                <input type="text" id="solicitudId" name="solicitudId" readonly>
            </div>
            <div class="flex-g">
                <label for="nombreSolicitante">Nombre del solicitante</label>
                <input type="text" id="nombreSolicitante" name="nombreSolicitante" readonly>
            </div>
            <div class="flex-g">
                <label for="direccionObra">Dirección de la obra</label>
                <input type="text" id="direccionObra" name="direccionObra" readonly>
            </div>
        </div>
        <div class="flex-row">
            <div class="flex-g">
                <label for="documentoIdentidad">Documento de identidad</label>
                <input type="text" id="documentoIdentidad" name="documentoIdentidad" readonly>
            </div>
            <div class="flex-g col-radio">
                <label>Propiedad acreditada*</label>
                <div class="radio-group">
                    <input type="radio" id="propAcredSi" name="propiedadAcreditada" value="true">
                    <label for="propAcredSi" class="radio-label">Si</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="propAcredNo" name="propiedadAcreditada" value="false">
                    <label for="propAcredNo" class="radio-label">No</label>
                </div>
                <small>¿Propiedad debidamente acreditada?</small>
            </div>
            <div class="flex-g col-radio">
                <label>Sin restricciones legales*</label>
                <div class="radio-group">
                    <input type="radio" id="sinResLegalesSi" name="sinRestriccionesLegales" value="true">
                    <label for="sinResLegalesSi" class="radio-label">Si</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="sinResLegalesNo" name="sinRestriccionesLegales" value="false">
                    <label for="sinResLegalesNo" class="radio-label">No</label>
                </div>
                <small>¿Sin restricciones legales sobre el predio?</small>
            </div>
            <div class="flex-g">
                <label for="observacionesJuridicas">Observaciones jurídicas*</label>
                <textarea id="observacionesJuridicas" name="observacionesJuridicas" required placeholder="Detalle los hallazgos de la evaluación jurídica"></textarea>
            </div>
            <div class="flex-g col-radio">
                <label>Evaluación jurídica final*</label>
                <div class="radio-group">
                    <input type="radio" id="jurAprobada" name="evaluacionJuridica" value="true">
                    <label for="jurAprobada" class="radio-label">APROBADA</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="jurRechazada" name="evaluacionJuridica" value="false">
                    <label for="jurRechazada" class="radio-label">RECHAZADA</label>
                </div>
                <small>¿En base a los resultados obtenidos considera que aprueba la evaluación?</small>
            </div>
        </div>
        <button class="enviar-btn" type="submit" id="btnEnviar">Guardar evaluación</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');
    if (taskId) {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r=>r.json())
            .then(data=>{
                document.getElementById('solicitudId').value = data.solicitudId?.value || '';
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('direccionObra').value = data.direccionObra?.value || '';
                document.getElementById('documentoIdentidad').value = data.documentoIdentidad?.value || '';
                document.getElementById('observacionesJuridicas').value = data.observacionesJuridicas?.value || '';
                if(data.propiedadAcreditada?.value === true)  document.getElementById('propAcredSi').checked = true;
                if(data.propiedadAcreditada?.value === false) document.getElementById('propAcredNo').checked = true;
                if(data.sinRestriccionesLegales?.value === true)  document.getElementById('sinResLegalesSi').checked = true;
                if(data.sinRestriccionesLegales?.value === false) document.getElementById('sinResLegalesNo').checked = true;
                if(data.evaluacionJuridica?.value === true)  document.getElementById('jurAprobada').checked = true;
                if(data.evaluacionJuridica?.value === false) document.getElementById('jurRechazada').checked = true;
            });
    }
    document.getElementById('jurForm').addEventListener('submit', function(e){
        e.preventDefault();
        if(!taskId) {
            alert('No se pudo determinar el taskId.');
            return;
        }
        const r1 = document.querySelector('input[name="propiedadAcreditada"]:checked');
        const r2 = document.querySelector('input[name="sinRestriccionesLegales"]:checked');
        const r3 = document.querySelector('input[name="evaluacionJuridica"]:checked');
        if(!r1 || !r2 || !r3 || !document.getElementById('observacionesJuridicas').value.trim()){
            alert('Complete todos los campos obligatorios.');
            return;
        }
        const vars = {
            propiedadAcreditada: { value: r1.value === "true", type:"Boolean" },
            sinRestriccionesLegales: { value: r2.value === "true", type:"Boolean" },
            evaluacionJuridica: { value: r3.value === "true", type: "Boolean" },
            observacionesJuridicas: { value: document.getElementById('observacionesJuridicas').value, type:"String" }
        };
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vars)
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Evaluación registrada correctamente.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
            } else {
                alert('Error al guardar la información.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
