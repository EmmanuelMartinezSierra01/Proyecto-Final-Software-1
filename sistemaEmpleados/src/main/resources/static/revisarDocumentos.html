<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revisión de Documentos</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: #f3f3fd; }
        .form-card { margin: 40px auto; background: #fff; border-radius: 14px; max-width: 460px; box-shadow: 0 4px 24px #5a579726; padding: 32px 40px;}
        label { color: #2b2d2f; font-weight: 600; font-size: 16px; margin-bottom: 10px; display: block;}
        .checkbox-group { margin-bottom: 20px;}
        .checkbox-inline { display: flex; align-items: center; margin-bottom: 16px;}
        .checkbox-inline input { width: auto; margin-right: 12px;}
        .enviar-btn {
            margin-top: 8px; background: #536dfe; color: #fff; border: none; padding: 12px 32px; border-radius: 6px;
            font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .enviar-btn:disabled { background: #b4c2ef; color: #fff; cursor: not-allowed;}
        .enviar-btn:hover { background: #3949ab; }
        .volver-btn {
            margin-bottom: 18px; background: #6a82fb; color: #fff; border: none; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .volver-btn:hover { background: #44318d; }
        .exito-msg { color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;}
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='menuEmpleado.html'" class="volver-btn">← Volver al inicio</button>
    <h2 style="margin-bottom:18px;">Revisión de Documentos</h2>

    <form id="revForm">
        <div class="checkbox-group">
            <div class="checkbox-inline">
                <input type="checkbox" id="Solicitud"> <label for="Solicitud">Solicitud escrita</label>
            </div>
            <div class="checkbox-inline">
                <input type="checkbox" id="Documentos"> <label for="Documentos">Otras documentación</label>
            </div>
        </div>
        <button class="enviar-btn" type="submit" id="btnEnviar" disabled>Guardar revisión</button>
    </form>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');

    if (!taskId) {
        alert('No se especificó taskId en la URL.');
    } else {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r => r.json())
            .then(data => {
                // Marcado automático según llegada de datos
                document.getElementById('Solicitud').checked  = data.Solicitud?.value === true;
                document.getElementById('Documentos').checked = data.Documentos?.value === true;
                document.getElementById('btnEnviar').disabled = false;
            })
            .catch(() => {
                alert('Error consultando detalles de la solicitud.');
            });
    }

    document.getElementById('revForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if(!taskId) {
            alert('No se pudo determinar el taskId.');
            return;
        }

        const variables = {
            Solicitud:   { value: document.getElementById('Solicitud').checked, type: "Boolean" },
            Documentos:  { value: document.getElementById('Documentos').checked, type: "Boolean" }
        };

        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(variables)
        }).then(r => {
            if(r.ok) {
                document.getElementById('mensajeExito').innerText = '✅ Revisión enviada correctamente.';
                document.getElementById('mensajeExito').style.display = '';
                document.getElementById('btnEnviar').disabled = true;
            } else {
                alert('Error al guardar la revisión.');
            }
        }).catch(() => {
            alert('Error de conexión.');
        });
    });
</script>
</body>
</html>
