<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Solicitud</title>
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: #f3f3fd;
            margin: 0;
            padding: 0;
        }
        .form-card {
            margin: 40px auto;
            background: #fff;
            border-radius: 14px;
            max-width: 650px;
            box-shadow: 0 4px 24px #5a579726;
            padding: 32px 40px;
        }
        label {
            color: #2b2d2f;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        input, textarea {
            width: 100%;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 20px;
            background: #f5f5f5;
            color: #424242;
        }
        input[readonly], textarea[readonly] {
            background: #f5f5f5;
            color: #888;
        }
        .row { display: flex; gap: 18px; }
        .col { flex: 1; }
        .volver-btn {
            margin-bottom: 18px;
            background: #6a82fb;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.16s;
        }
        .volver-btn:hover { background: #44318d; }
        .confirmar-btn {
            margin-top: 10px;
            background: #28bb6a;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.16s;
        }
        .confirmar-btn:disabled { background: #c9e7d4; color: #fff; cursor: not-allowed; }
        .confirmar-btn:hover { background: #229f5a; }
        .exito-msg {
            color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;
        }
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='menuEmpleado.html'" class="volver-btn">
        ← Volver al inicio
    </button>

    <h2 style="margin-bottom:18px;">Detalle de la Solicitud</h2>

    <label for="nombreSolicitante">Nombre Solicitante</label>
    <input type="text" id="nombreSolicitante" readonly>

    <div class="row">
        <div class="col">
            <label for="cedula">Cédula del solicitante</label>
            <input type="text" id="cedula" readonly>
        </div>
        <div class="col">
            <label for="tipoSolicitud">Tipo de solicitud</label>
            <input type="text" id="tipoSolicitud" readonly>
        </div>
    </div>

    <label for="detalleSolicitud">Detalle de la solicitud</label>
    <textarea id="detalleSolicitud" readonly></textarea>

    <button class="confirmar-btn" id="btnConfirmar" onclick="confirmarTarea()" disabled>Confirmar revisión</button>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');

    function mostrarExito(msg) {
        document.getElementById('mensajeExito').innerText = msg;
        document.getElementById('mensajeExito').style.display = '';
        document.getElementById('btnConfirmar').disabled = true;
    }

    if (!taskId) {
        alert('No se especificó taskId en la URL.');
    } else {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r => r.json())
            .then(data => {
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('cedula').value             = data.cedula?.value || '';
                document.getElementById('tipoSolicitud').value      = data.tipoSolicitud?.value || '';
                document.getElementById('detalleSolicitud').value   = data.detalleSolicitud?.value || '';
                document.getElementById('btnConfirmar').disabled = false;
            })
            .catch(() => {
                alert('Error consultando detalles de la solicitud.');
            });
    }

    function confirmarTarea() {
        const btn = document.getElementById('btnConfirmar');
        btn.disabled = true;
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({}) // Sin variables adicionales, solo completar
        })
            .then(r => {
                if (r.ok) {
                    mostrarExito('✅ La revisión fue confirmada y el proceso avanzó correctamente.');
                } else {
                    btn.disabled = false;
                    alert('Error al completar la tarea.');
                }
            })
            .catch(() => {
                btn.disabled = false;
                alert('Error de conexión al completar la tarea.');
            });
    }
</script>
</body>
</html>
