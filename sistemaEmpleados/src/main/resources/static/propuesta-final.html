<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Propuesta Final</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background: #f3f3fd; margin: 0; }
        .form-card { margin: 40px auto; background: #fff; border-radius: 14px; max-width: 700px; box-shadow: 0 4px 24px #5a579726; padding: 32px 40px;}
        label { color: #2b2d2f; font-weight: 600; font-size: 14px; margin-bottom: 4px; display: block;}
        input, textarea {
            width: 100%; border-radius: 6px; border: 2px solid #e0e0e0; padding: 10px 12px;
            font-size: 14px; margin-bottom: 20px; background: #f5f5f5; color: #424242;
        }
        input[readonly], textarea[readonly] { background: #f5f5f5; color: #888; }
        .enviar-btn {
            margin-top: 10px; background: #536dfe; color: #fff; border: none; padding: 12px 32px; border-radius: 6px;
            font-size: 16px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .enviar-btn:disabled { background: #b4c2ef; color: #fff; cursor: not-allowed;}
        .enviar-btn:hover { background: #3949ab; }
        .volver-btn {
            margin-bottom: 18px; background: #6a82fb; color: #fff; border: none; padding: 9px 22px; border-radius: 6px;
            font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.16s;
        }
        .volver-btn:hover { background: #44318d; }
        .exito-msg { color: #28bb6a; margin-top: 16px; font-size: 15px; font-weight: 600;}
    </style>
</head>
<body>
<div class="form-card">
    <button onclick="window.location.href='menuEmpleado.html'" class="volver-btn">
        ← Volver al inicio
    </button>
    <h2 style="margin-bottom:18px;">Propuesta Final</h2>

    <label for="peticion">Petición</label>
    <textarea id="peticion" readonly></textarea>

    <label for="nombreSolicitante">Nombre Solicitante</label>
    <input type="text" id="nombreSolicitante" readonly>

    <label for="tipoSolicitud">Tipo de solicitud</label>
    <input type="text" id="tipoSolicitud" readonly>

    <label for="detalleSolicitud">Detalle de la solicitud</label>
    <input type="text" id="detalleSolicitud" readonly>

    <label for="propuestaDesarrollada">Escriba la propuesta</label>
    <textarea id="propuestaDesarrollada" placeholder="Ingrese la propuesta final aquí..."></textarea>

    <button class="enviar-btn" id="btnEnviar" onclick="enviarPropuesta()" disabled>Enviar propuesta</button>
    <div id="mensajeExito" class="exito-msg" style="display:none;"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('taskId');

    function mostrarExito(msg) {
        document.getElementById('mensajeExito').innerText = msg;
        document.getElementById('mensajeExito').style.display = '';
        document.getElementById('btnEnviar').disabled = true;
        document.getElementById('propuestaDesarrollada').disabled = true;
    }

    if (!taskId) {
        alert('No se especificó taskId en la URL.');
    } else {
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId))
            .then(r => r.json())
            .then(data => {
                // Aquí traes la variable solicitudAjuste para poner en el campo "Petición"
                document.getElementById('peticion').value = data.solicitudAjuste?.value || '';
                document.getElementById('nombreSolicitante').value = data.nombreSolicitante?.value || '';
                document.getElementById('tipoSolicitud').value = data.tipoSolicitud?.value || '';
                document.getElementById('detalleSolicitud').value = data.detalleSolicitud?.value || '';
                document.getElementById('propuestaDesarrollada').value = data.propuestaDesarrollada?.value || '';
                document.getElementById('btnEnviar').disabled = false;
            })
            .catch(() => {
                alert('Error consultando detalles de la solicitud.');
            });
    }

    function enviarPropuesta() {
        const propuesta = document.getElementById('propuestaDesarrollada').value.trim();
        const btn = document.getElementById('btnEnviar');
        if (!propuesta) {
            alert('Por favor ingrese la propuesta final.');
            return;
        }
        btn.disabled = true;
        fetch('/api/empleado/tarea/' + encodeURIComponent(taskId) + '/completar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                propuestaDesarrollada: { value: propuesta, type: "String" }
            })
        })
            .then(r => {
                if (r.ok) {
                    mostrarExito('✅ La propuesta final fue enviada y el proceso avanzó.');
                } else {
                    btn.disabled = false;
                    alert('Error al enviar la propuesta final.');
                }
            })
            .catch(() => {
                btn.disabled = false;
                alert('Error de conexión al enviar la propuesta final.');
            });
    }
</script>
</body>
</html>
